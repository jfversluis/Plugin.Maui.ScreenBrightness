name: Build for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

jobs:
  build-plugin-ci:
    runs-on: windows-latest
      
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install .NET MAUI Workload
      run: dotnet workload restore src\Plugin.Maui.ScreenBrightness\Plugin.Maui.ScreenBrightness.csproj

    - name: Restore dependencies
      run: dotnet restore src\Plugin.Maui.ScreenBrightness\Plugin.Maui.ScreenBrightness.csproj

    - name: Build
      run: dotnet build src\Plugin.Maui.ScreenBrightness\Plugin.Maui.ScreenBrightness.csproj -c Release
